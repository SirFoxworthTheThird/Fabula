<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="A lit kitchen window at dusk, seen from the table">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2733"/>
      <stop offset="1" stop-color="#2b2a2a"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.72" cy="0.34" r="0.5">
      <stop offset="0" stop-color="#f0c37a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f0c37a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="100" fill="url(#dusk)"/>
  <!-- The window, and the last of the light behind it. -->
  <rect x="252" y="16" width="96" height="62" rx="2" fill="#33404a"/>
  <rect x="256" y="20" width="42" height="26" fill="#4d6072"/>
  <rect x="302" y="20" width="42" height="26" fill="#54697c"/>
  <rect x="256" y="50" width="42" height="24" fill="#3f5163"/>
  <rect x="302" y="50" width="42" height="24" fill="#45596b"/>
  <rect width="400" height="100" fill="url(#lamp)"/>
  <!-- The long scrubbed table, and the kettle nobody has moved. -->
  <rect x="0" y="68" width="400" height="32" fill="#6b5541"/>
  <rect x="0" y="68" width="400" height="3" fill="#8a6f55"/>
  <path d="M196 68 v-16 a10 10 0 0 1 20 0 v16 z" fill="#3c3a38"/>
  <path d="M216 57 q10 3 10 9" stroke="#3c3a38" stroke-width="3" fill="none"/>
  <circle cx="206" cy="48" r="2.6" fill="#2f2d2c"/>
</svg>

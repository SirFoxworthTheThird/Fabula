# A school, which is the case the other three worlds do not cover: an
# author cannot write every corridor, and a story that answers "there is
# no library to go to" is answering with its own scaffolding.
#
# So the spine is authored and the rest is found. What the story turns on
# is named; everything that turns on nothing is furniture.
id: ardenhall
title: Ardenhall
blurb: >-
  A school on your first day, where the map is bigger than anyone wrote down.
language: en
discover_rooms: true

rooms:
  hall:
    name: the entrance hall
    description: >
      Black-and-white flags to the ceiling, a staircase that does not go
      where it looks like it goes, and thirty new trunks in a row along
      the wall with their labels still on.
    adjacent:
      office: adjacent
  office:
    name: the Director's office
    description: >
      A desk kept clear on purpose, a window onto the quad, and more
      chairs than anyone has ever needed at once.
    adjacent:
      hall: adjacent

facts:
  # The placement is spoken when a house is *named*. "Which house are you
  # in?" is a question, not an answer, and a keyword loose enough to match
  # it would end the scene on somebody asking.
  your_placement:
    keywords:
      - Ashe House
      - Corvin House
      - Thane House
  the_seventh_file:
    keywords:
      - the seventh file
      - the sealed file
      - what happened at Marlow

# The only kind of object worth modelling here: one that carries a fact.
# The room can see you open it; what it says is yours alone.
items:
  the_sealed_file:
    name: the grey folder on the desk
    location_id: office
    reveals: the_seventh_file
    text: >
      Marlow Academy — incident report, 4 June. Two paragraphs are struck
      through in a different hand. What is left says a stair rail on the
      third floor came away from the wall while eleven children were on
      it, that nobody was hurt, and that the matter is closed. Your name
      is in the margin, twice, circled.
  the_intake_list:
    name: the intake list pinned by the stairs
    location_id: hall
    text: >
      Thirty-one names in a column, each with a house beside it. Yours is
      the only one where the house has been rubbed out and not written
      in again.

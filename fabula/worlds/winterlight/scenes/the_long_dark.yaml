# The sandbox. An ordinary evening nine months in, with everyone in a
# different room — which is the point. Ashgrove's opener puts the player
# beside the person with the secret; this one starts you alone in the
# middle of a chain and makes you go and find people.
id: the_long_dark
world: winterlight
title: The long dark
premise: >-
  Four of you awake in a building where sound does not travel the way you think.
opening: >-
  Nine months in, three weeks of dark still to run, and the four of you
  have stopped being in the same room. You are in the mess with the urn
  ticking. Ilse is on the radio, Yusuf is down with the generator, Nadia
  turned in early. You are the station doctor and almost nothing has
  needed a doctor all winter.
mode: sandbox
cast:
  - ilse
  - yusuf
  - nadia
  - ana
# Written for this world, not in the room when it opens.
may_arrive:
  - petra
starting_positions:
  ilse: radio        # two rooms from the bunkroom: out of earshot entirely
  yusuf: generator   # a room you can hear into and not out of
  nadia: bunkroom
  ana: mess
start_time: 2024-08-14T21:40:00
turn_budget: 8
max_consecutive_agent_turns: 3

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabula</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#128220;</text></svg>">
<style>
  :root {
    --ink: #e8e3da;
    --ink-dim: #9a9287;
    --ink-faint: #6b655d;
    --ground: #14130f;
    --panel: #1c1a16;
    --edge: #2e2a24;
    --accent: #c9a227;
    --you: #8fb8c9;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.6;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 1px solid var(--edge);
    padding: 10px 20px;
    display: flex;
    gap: 18px;
    align-items: baseline;
    flex-wrap: wrap;
    font-family: var(--sans);
    font-size: 13px;
    background: var(--panel);
  }
  header .where { color: var(--ink); font-weight: 600; letter-spacing: .01em; }
  header .who, header .clock { color: var(--ink-dim); }
  header .who em { color: var(--ink); font-style: normal; }
  header .spacer { flex: 1; }
  header .pov {
    color: var(--ink-faint);
    border: 1px solid var(--edge);
    border-radius: 999px;
    padding: 2px 10px;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 26px 20px 8px;
  }
  .scroll { max-width: 40rem; margin: 0 auto; }

  .line { margin: 0 0 14px; }
  .line .speaker {
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    display: block;
    margin-bottom: 2px;
  }
  .line.you .speaker { color: var(--you); }
  .line.you .said { color: #cfe2ea; }

  /* Narration, arrivals, materialised detail: things observed, not said. */
  .line.prose {
    color: var(--ink-dim);
    font-style: italic;
    padding-left: 14px;
    border-left: 2px solid var(--edge);
  }

  /* Perception is graded, and the interface has to show it. A degraded
     event is something half-heard through a wall: it must not read as
     reliable testimony. */
  .line.degraded {
    color: var(--ink-faint);
    font-style: italic;
    padding-left: 14px;
    border-left: 2px dashed var(--edge);
  }
  .line.degraded .tag {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: 0 4px;
    margin-right: 6px;
  }

  .line.skip {
    text-align: center;
    color: var(--accent);
    font-style: italic;
    opacity: .8;
    margin: 22px 0;
  }
  .line.skip::before, .line.skip::after { content: "· · ·"; display: block; opacity: .5; }

  footer {
    border-top: 1px solid var(--edge);
    background: var(--panel);
    padding: 12px 20px 16px;
  }
  .bar { max-width: 40rem; margin: 0 auto; }

  form { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1;
    background: var(--ground);
    border: 1px solid var(--edge);
    border-radius: 6px;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 16px;
    padding: 10px 12px;
  }
  input[type=text]:focus { outline: none; border-color: var(--ink-faint); }

  button {
    font-family: var(--sans);
    font-size: 13px;
    background: var(--ground);
    color: var(--ink-dim);
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-faint); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { color: var(--ground); background: var(--accent); border-color: var(--accent); font-weight: 600; }

  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
    align-items: center;
  }
  .actions .label {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-right: 2px;
  }

  #start { max-width: 40rem; margin: 8vh auto; padding: 0 20px; }
  #start h1 { font-size: 34px; margin: 0 0 6px; letter-spacing: .01em; }
  #start p { color: var(--ink-dim); margin: 0 0 26px; }
  #start .scene {
    display: block;
    width: 100%;
    text-align: left;
    margin-bottom: 8px;
    padding: 14px 16px;
    font-family: var(--serif);
    font-size: 17px;
    color: var(--ink);
  }
  #start .scene small { display: block; color: var(--ink-faint); font-family: var(--sans); font-size: 12px; }
  .hidden { display: none !important; }
  .notice { color: var(--ink-faint); font-family: var(--sans); font-size: 12px; margin-top: 8px; min-height: 1.2em; }
</style>
</head>
<body>

<section id="start">
  <h1>Fabula</h1>
  <p>Every character knows only what they perceived. So do you.</p>
  <div id="scenes"></div>
  <div class="notice" id="start-notice"></div>
</section>

<header id="hud" class="hidden">
  <span class="where" id="where"></span>
  <span class="who" id="who"></span>
  <span class="clock" id="clock"></span>
  <span class="spacer"></span>
  <span class="pov" id="pov"></span>
</header>

<main id="stage" class="hidden"><div class="scroll" id="scroll"></div></main>

<footer id="controls" class="hidden">
  <div class="bar">
    <form id="say-form">
      <input type="text" id="say" placeholder="Say or do something…" autocomplete="off">
      <button class="primary" type="submit">Say</button>
    </form>
    <div class="actions">
      <button type="button" id="look">Look around</button>
      <button type="button" id="wait">Let time pass</button>
      <span class="label" id="rooms-label">Go to</span>
      <span id="rooms"></span>
    </div>
    <div class="notice" id="notice"></div>
  </div>
</footer>

<script>
// This client renders one character's projection. Every line it shows
// arrived over the stream already filtered by the world model, carrying
// perceived content and its own visibility. There is no world log here to
// render by mistake.
const api = {
  worlds: () => fetch("/worlds").then(r => r.json()),
  open: (world, scene) =>
    fetch("/sessions", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({world, scene}),
    }).then(r => r.json()),
  state: id => fetch(`/sessions/${id}`).then(r => r.json()),
  post: (id, what, body) =>
    fetch(`/sessions/${id}/${what}`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body || {}),
    }).then(r => r.json()),
};

let sessionId = null;
const seen = new Set();

const el = id => document.getElementById(id);
const scroll = () => el("stage").scrollTop = el("stage").scrollHeight;

function say(text) { return act("say", {text}); }

async function act(what, body) {
  setBusy(true);
  try {
    // The stream is the single source of what gets displayed; the
    // response body is ignored so an event cannot be rendered twice.
    await api.post(sessionId, what, body);
    await refresh();
  } finally {
    setBusy(false);
  }
}

function setBusy(busy) {
  for (const node of document.querySelectorAll("footer button, #say")) node.disabled = busy;
  el("notice").textContent = busy ? "…" : "";
  if (!busy) el("say").focus();
}

function render(event) {
  if (seen.has(event.seq)) return;
  seen.add(event.seq);

  const line = document.createElement("p");
  line.className = "line";

  if (event.kind === "time_skip") {
    line.classList.add("skip");
    line.textContent = event.content;
  } else if (event.visibility === "degraded") {
    // Half-heard. Shown as uncertain, never attributed to a speaker —
    // the character does not know for certain who that was.
    line.classList.add("degraded");
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "unclear";
    line.append(tag, document.createTextNode(event.content));
  } else if (event.kind === "utterance") {
    if (event.speaker === state.character) line.classList.add("you");
    const who = document.createElement("span");
    who.className = "speaker";
    who.textContent = event.speaker_name || "";
    const said = document.createElement("span");
    said.className = "said";
    said.textContent = event.content;
    line.append(who, said);
  } else {
    line.classList.add("prose");
    line.textContent = event.content;
  }

  el("scroll").appendChild(line);
  scroll();
}

let state = {};

async function refresh() {
  state = await api.state(sessionId);
  el("where").textContent = state.location_name;
  el("who").innerHTML = state.present.length
    ? "with " + state.present.map(p => `<em>${p.name}</em>`).join(", ")
    : "alone";
  el("clock").textContent = new Date(state.story_time).toLocaleTimeString([], {
    hour: "numeric", minute: "2-digit",
  });
  el("pov").textContent = state.character_name + "’s point of view";

  const rooms = el("rooms");
  rooms.textContent = "";
  for (const room of state.rooms) {
    if (room.id === state.location) continue;
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = room.name;
    button.onclick = () => act("move", {room: room.id});
    rooms.appendChild(button);
  }

  const waitButton = el("wait");
  const pending = state.pending_skip_minutes;
  waitButton.textContent = pending ? `Let ${describe(pending)} pass` : "Let time pass";
  waitButton.disabled = pending === null;
}

function describe(minutes) {
  if (minutes >= 60 && minutes % 60 === 0) {
    const hours = minutes / 60;
    return hours === 1 ? "an hour" : `${hours} hours`;
  }
  return `${minutes} minutes`;
}

function listen() {
  const stream = new EventSource(`/sessions/${sessionId}/stream`);
  stream.onmessage = message => render(JSON.parse(message.data));
  stream.onerror = () => { el("notice").textContent = "Reconnecting…"; };
}

async function begin(world, scene) {
  const opened = await api.open(world, scene);
  if (opened.detail) { el("start-notice").textContent = opened.detail; return; }
  sessionId = opened.session_id;
  el("start").classList.add("hidden");
  for (const id of ["hud", "stage", "controls"]) el(id).classList.remove("hidden");
  await refresh();
  listen();
  el("say").focus();
}

el("say-form").addEventListener("submit", event => {
  event.preventDefault();
  const text = el("say").value.trim();
  if (!text) return;
  el("say").value = "";
  say(text);
});
el("look").onclick = () => act("look");
el("wait").onclick = async () => {
  const minutes = state.pending_skip_minutes;
  if (minutes === null) return;
  // Time is something the player should never lose without noticing.
  if (minutes > 60 && !confirm(`Let ${describe(minutes)} pass?`)) return;
  await act("wait", {consent: true});
};

api.worlds().then(worlds => {
  const list = el("scenes");
  const entries = Object.entries(worlds);
  if (!entries.length) {
    el("start-notice").textContent = "No worlds found.";
    return;
  }
  for (const [world, scenes] of entries) {
    for (const scene of scenes) {
      const button = document.createElement("button");
      button.className = "scene";
      button.innerHTML = `${scene.replace(/_/g, " ")}<small>${world}</small>`;
      button.onclick = () => begin(world, scene);
      list.appendChild(button);
    }
  }
});
</script>
</body>
</html>

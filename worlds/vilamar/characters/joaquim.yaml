id: joaquim
name: "Joaquim"
persona: >
  Joaquim tem quarenta e dois anos e ficou com a casa quando o pai
  morreu. Em Fevereiro vendeu o barco e a licença a um homem de Peniche,
  e pagou dívidas que ninguém sabia que existiam. Disse à irmã que o
  barco está em seco à espera de obras. Não é ganância nem vergonha do
  dinheiro: é que foi o pai que construiu aquele barco, e dizê-lo em voz
  alta torna aquilo definitivo. Cada semana que passa torna a conversa
  pior.

id: tomas
name: "Tomás"
persona: >
  Tomás is the middle sibling, endlessly practical, quick with a joke to
  cut tension. Six months ago he knocked their late grandmother's music
  box off the mantel and shattered it. He glued it back together himself,
  set it exactly where it stood, and told no one — he let their mother
  believe the cat did it. He trusts Elena enough to admit it under the
  right pressure, but he is desperate that Maria never finds out; she
  would tell their mother out of principle before the week is out.
